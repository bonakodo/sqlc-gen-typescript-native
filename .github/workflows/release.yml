name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run tools
      - name: Check, test, and build WASM
        run: npm run check
      - name: Install stock sqlc
        run: |
          tools/setup-sqlc.sh
          echo "$PWD/bin/.tools/sqlc-1.31.1" >> "$GITHUB_PATH"
      - name: Check WASM generation with stock sqlc
        run: node --test tests/integration/generate_test.ts
      - name: Prepare checksum and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd bin
          sha256sum --check sqlc-gen-typescript-native.wasm.sha256
          checksum=$(cut -d ' ' -f 1 sqlc-gen-typescript-native.wasm.sha256)
          cat > release-notes.md <<EOF
          The TypeScript generator now uses a pure WebAssembly implementation,
          written in WebAssembly text (WAT), replacing the previous Go implementation.
          The plugin runs directly in sqlc's WASI host.

          The release filename stays the same. If you used the
          process plugin, switch to the WASM configuration below. The Go library
          and process plugin are no longer included.

          Generated code now supports Node and Bun. Deno output and the
          @bonakodo/sqlite driver are no longer supported. Update those configs
          to use Node or Bun with node:sqlite, bun:sqlite, or better-sqlite3.

          SQLite now always uses native value types and synchronous helpers.
          Remove sqlite_type_mode from configs; integer arguments, rows, and
          insert IDs use bigint. Use the safe_integer preset for number fields.

          Use this release in your sqlc configuration:

          \`\`\`yaml
          version: "2"
          plugins:
            - name: typescript
              wasm:
                url: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/sqlc-gen-typescript-native.wasm
                sha256: ${checksum}
          sql:
            - engine: postgresql
              schema: schema.sql
              queries: query.sql
              codegen:
                - plugin: typescript
                  out: db
                  options:
                    runtime: node
                    driver: pg
          \`\`\`

          Run \`sqlc generate\`. No local plugin build is needed.
          EOF
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            bin/sqlc-gen-typescript-native.wasm \
            bin/sqlc-gen-typescript-native.wasm.sha256 \
            --verify-tag \
            --title "$TAG" \
            --generate-notes \
            --notes-file bin/release-notes.md \
            "${flags[@]}"
